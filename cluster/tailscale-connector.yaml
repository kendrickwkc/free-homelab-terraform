# Tailscale subnet router: advertises cluster CIDRs to the tailnet so laptop
# clients reach the API server, pod IPs and service ClusterIPs directly —
# no bastion tunnel, no kubectl port-forward.
#
# Fill in advertiseRoutes from docs/tailscale.md ("Discover the CIDRs"), then:
#   kubectl apply -f cluster/tailscale-connector.yaml
# and approve the routes once in the Tailscale admin console (Machines page).
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: cluster-router
  namespace: tailscale
spec:
  replicas: 1
  hostnamePrefix: cluster-router
  subnetRouter:
    advertiseRoutes:
      - 10.96.0.0/16   # service ClusterIPs (OKE default)
      - 10.244.0.0/16  # pod overlay (flannel; per-node /25s live inside this)
      - 10.0.1.0/24    # VCN private subnet: OKE API endpoint + MySQL
