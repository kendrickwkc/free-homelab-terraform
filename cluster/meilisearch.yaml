# Optional shared Meilisearch. Pinned to the storage=true node; the 50 Gi PVC
# consumes the entire remaining block-volume budget — shrink it if tenants
# also need block-backed volumes. Seal the master key first (see the
# platform README's cluster-services step), then apply this manifest.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-data
  namespace: platform
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: oci-bv
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: meilisearch }
  template:
    metadata:
      labels: { app: meilisearch }
    spec:
      nodeSelector:
        storage: "true"
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.53.0
          ports: [{ containerPort: 7700 }]
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch-master-key
                  key: MEILI_MASTER_KEY
          volumeMounts:
            - name: data
              mountPath: /meili_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: meilisearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: platform
spec:
  selector: { app: meilisearch }
  ports: [{ port: 7700, targetPort: 7700 }]
