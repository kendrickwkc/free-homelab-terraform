# How to seal the tenant's Cloudflare tunnel token.
#
# This file is a template, not an applied manifest — keep it out of
# kustomization.yaml resources. The plaintext steps below never touch git.
#
# 1. Get the plaintext token from the tenant's Terraform outputs:
#      cd infra && terraform output -raw tunnel_token > /tmp/tunnel-token
# 2. Render the plaintext Secret (never commit this):
#      kubectl create namespace example   # if not created yet
#      kubectl -n example create secret generic cloudflared-token \
#        --from-file=token=/tmp/tunnel-token \
#        --dry-run=client -o yaml > /tmp/cloudflared-token.plain.yaml
# 3. Seal it into git:
#      mkdir -p k8s/sealed
#      kubeseal --controller-name sealed-secrets-controller \
#        --controller-namespace kube-system \
#        < /tmp/cloudflared-token.plain.yaml > k8s/sealed/cloudflared-token.yaml
#      rm /tmp/tunnel-token /tmp/cloudflared-token.plain.yaml
# 4. Add k8s/sealed/cloudflared-token.yaml to kustomization.yaml resources,
#    commit, and apply:  kubectl apply -k k8s/
