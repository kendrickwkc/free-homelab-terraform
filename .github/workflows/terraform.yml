name: terraform

on:
  push:
    branches: [main]
  pull_request:

env:
  TF_VERSION: "1.12.2"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [platform, modules/tenant, examples/example-tenant]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init & validate (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
